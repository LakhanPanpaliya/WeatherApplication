<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather</title>
  <link rel="stylesheet" href="./style.css">
  <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body>
  <div class="parent-div">
    <!-- nav bar -->
    <div class="nav-bar">
      <i class="bi bi-brightness-high blues heading-sym"></i>
      <h2 class="blues heading">Weather</h2>
      <div class="search-bar">
        <i class="fa-solid fa-magnifying-glass serach-icon"></i>
        <input type="text" placeholder="Search city" id="input-city">
      </div>
       <div class="menu-bar">
        <p class="menu-item">Today</p>
        <p>Forecast</p>
        <p>Radar</p>
        <p>Settings</p>
        <p><i class="fa-solid fa-location-dot"></i></p>
       </div>
       
    </div>
    <!-- main body -->
     <div class="main-body">
      <div class="section1">
        <div class="leftside">
          <div class="left-part">
          <div class="location-cityname">
            <p><i class="fa-solid fa-location-dot"></i></p>
            <p class="city-names" id="city_name">Pune</p>
            <!-- <p><img id="symbolsimg"></p> -->
          </div>
          <p id="dateTime">Mon,5 may</p>
          <div class="degree-div">
            <h1 id="degree-heading">41<sup>o</sup></h1>
            <p>Mostly Sunny</p>
          </div>
          </div>
        <div class="right-part">
            <!-- precip -->
             <div class="precip-div">
              <i class="fa-solid fa-droplet" style="color: rgb(116, 192, 252);"></i>
              <p>Description</p>
              <p id="description">Clear sky</p>
             </div>
             <!-- WIND -->
              <div class="wind-div">
                <i class="fa-solid fa-wind" style="color: rgb(116, 192, 252);"></i>
                <p>Wind</p>
                <p id="wind">8km/h</p>
              </div>
        </div>
      </div>
      <div class="rightside">
        <div class="card card1">
          <div class="card-heading">
            <p class="card-name">Temperature</p>
            <i class="bi bi-brightness-high blues heading-sym"></i>
          </div>
          <p class="temp-right" id="degree-headings">24<sup>o</sup></p>
           
          <div class="desc">
            <div class="min temp">
              <p>Min</p>
              <p id="min-temp">18<sup>o</sup></p>
            </div>
            <div class="max temp">
              <p>Max</p>
              <p id="max-temp">28<sup>o</sup></p>
            </div>
          </div>
        </div>

        <div class="card card2">
          <div class="card-heading">
            <p class="card-name">Humidity</p>
            <i class="fa-solid fa-droplet" style="color: rgb(116, 192, 252);"></i>
          </div>
          <p id="humiditys">64%</p>
          <p class="desc humidity-desc">The dew point is 15 right now.</p>
          
        </div>
      </div>
      </div>

      <!-- section 2 -->
       <div class="section2">
        <!-- visibility -->
        <div class="visibilty cards">
          <i class="fa-regular fa-eye" style="color: rgb(116, 192, 252);"></i>
          <p >Visibility</p>
          <p id="visibility">10 km</p>
        </div>

        <!-- Pressure -->
         <div class="presurre cards">
            <i class="fa-solid fa-minimize" style="color: rgb(116, 192, 252);"></i>
            <p>Pressure</p>
            <p id="pressure">1012 hPa</p>
         </div>

         <!-- Feels Like -->
          <div class="feelslike cards">
            <i class="fa-solid fa-temperature-high" style="color: rgb(116, 192, 252);"></i>
            <p>Feels Like</p>
            <p id="feel-like">26<sup>o</sup></p>
          </div>

          <!-- sunset -->
          <div class="visibilty cards">
            <i class="bi bi-sunset" style="color: rgb(116, 192, 252);"></i>
            <p>Sunset</p>
            <p id="sunset">10:14</p>
        </div>
       </div>

       <!-- section 3 -->
        <div class="section3">
          <div class="section3-heading">
            <p>Hourly Forecast</p>
          </div>
           <div class="hourly-time" id="hourly-container">
           </div>
        </div>
     </div>
  </div>
  <script src="./script.js"></script>
</body>
</html>
